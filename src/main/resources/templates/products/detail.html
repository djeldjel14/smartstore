<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' - SmartStore'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">SmartStore</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="/cart">Cart</a></li>
            <li class="nav-item"><a class="nav-link" href="/orders">Orders</a></li>
        </ul>
    </div>
</nav>

<div class="container my-5">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <p th:if="${product.imageUrl}" th:text="${product.imageUrl}"></p>
                    <p th:unless="${product.imageUrl}" class="text-muted">No image available</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <h1 th:text="${product.name}"></h1>
            <p class="text-muted" th:text="${product.description}"></p>
            
            <div class="mb-3">
                <h3 class="text-primary" th:text="'$' + ${product.price}"></h3>
                <p th:text="'Stock: ' + ${product.stock}"></p>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/products/{id}/add-to-cart(id=${product.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}" class="form-control" style="width: 100px;">
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Add to Cart</button>
            </form>

            <a href="/products" class="btn btn-secondary mt-3">Back to Products</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
