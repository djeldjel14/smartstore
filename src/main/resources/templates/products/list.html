<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - SmartStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card { transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">SmartStore</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="/cart">Cart</a></li>
            <li class="nav-item"><a class="nav-link" href="/orders">Orders</a></li>
        </ul>
    </div>
</nav>

<div class="container my-5">
    <div class="row mb-4">
        <div class="col-md-6">
            <h2>Products</h2>
        </div>
        <div class="col-md-6">
            <form th:action="@{/products}" method="get" class="d-flex">
                <input type="text" name="search" class="form-control" placeholder="Search products" th:value="${search}">
                <button type="submit" class="btn btn-primary ms-2">Search</button>
            </form>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row">
        <div th:each="product : ${products.content}" class="col-md-3 mb-4">
            <div class="card product-card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}"></h5>
                    <p class="card-text text-muted" th:text="${#strings.abbreviate(product.description, 50)}"></p>
                    <p class="card-text"><strong>$<span th:text="${product.price}"></span></strong></p>
                    <p class="card-text text-muted" th:text="'Stock: ' + ${product.stock}"></p>
                    <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-primary btn-sm">View Details</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav aria-label="Page navigation" th:if="${products.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!products.hasPrevious() ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/products(page=${products.number - 1})}" th:if="${products.hasPrevious()}">Previous</a>
            </li>
            <li class="page-item active">
                <span class="page-link" th:text="${products.number + 1} + ' of ' + ${products.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${!products.hasNext() ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/products(page=${products.number + 1})}" th:if="${products.hasNext()}">Next</a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
