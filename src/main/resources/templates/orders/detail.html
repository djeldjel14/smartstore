<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Order #' + ${order.id} + ' - SmartStore'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">SmartStore</a>
    </div>
</nav>

<div class="container my-5">
    <h2 th:text="'Order #' + ${order.id}"></h2>
    
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Order Information</h5>
                    <p><strong>Status:</strong> <span class="badge" 
                        th:classappend="${order.status == 'PENDING' ? 'bg-warning' : order.status == 'CONFIRMED' ? 'bg-info' : order.status == 'SHIPPED' ? 'bg-primary' : order.status == 'DELIVERED' ? 'bg-success' : 'bg-danger'}"
                        th:text="${order.status}"></span></p>
                    <p><strong>Date:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                    <p><strong>Total Amount:</strong> <span th:text="'$' + ${order.totalAmount}"></span></p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Shipping Details</h5>
                    <p><strong>Address:</strong> <span th:text="${order.shippingAddress}"></span></p>
                    <p><strong>Phone:</strong> <span th:text="${order.phoneNumber}"></span></p>
                    <p><strong>Notes:</strong> <span th:text="${order.notes}"></span></p>
                </div>
            </div>
        </div>
    </div>

    <h4 class="mt-5">Order Items</h4>
    <table class="table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${order.orderItems}">
                <td th:text="${item.product.name}"></td>
                <td th:text="'$' + ${item.price}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="'$' + ${item.getSubtotal()}"></td>
            </tr>
        </tbody>
    </table>

    <a href="/orders" class="btn btn-secondary">Back to Orders</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
