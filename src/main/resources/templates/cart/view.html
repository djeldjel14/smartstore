<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - SmartStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">SmartStore</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="/cart">Cart</a></li>
            <li class="nav-item"><a class="nav-link" href="/orders">Orders</a></li>
        </ul>
    </div>
</nav>

<div class="container my-5">
    <h2 class="mb-4">Shopping Cart</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${cartItems.empty}" class="alert alert-info">
        Your cart is empty. <a href="/products">Continue shopping</a>
    </div>

    <div th:unless="${cartItems.empty}">
        <table class="table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${cartItems}">
                    <td th:text="${item.product.name}"></td>
                    <td th:text="'$' + ${item.product.price}"></td>
                    <td>
                        <form th:action="@{/cart/{id}/update(id=${item.id})}" method="post" style="display: inline;">
                            <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control" style="width: 80px; display: inline;">
                            <button type="submit" class="btn btn-sm btn-info">Update</button>
                        </form>
                    </td>
                    <td th:text="'$' + ${item.product.price * item.quantity}"></td>
                    <td>
                        <form th:action="@{/cart/{id}/remove(id=${item.id})}" method="post" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="text-end mb-4">
            <h4>Total: <span th:text="'$' + ${total}"></span></h4>
        </div>

        <a th:href="@{/orders/checkout}" class="btn btn-success btn-lg">Proceed to Checkout</a>
        <a href="/products" class="btn btn-secondary">Continue Shopping</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
