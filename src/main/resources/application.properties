# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartstore}
spring.datasource.username=${DB_USERNAME:khaled}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Application name and context
spring.application.name=SmartStore
server.servlet.context-path=/

# Logging
logging.level.root=INFO
logging.level.com.smartstore=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-at-least-256-bits-long-for-security}
jwt.expiration=${JWT_EXPIRATION:86400000}
